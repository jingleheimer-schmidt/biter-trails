[mod-setting-description]
biter-trails-color=Determina si els mossegadors generen un rastre acolorit quan es mouen
biter-trails-glow=Determina si els mossegadors generen un rastre lluminós quan es mouen
biter-trails-scale=Determina la mida del rastre
biter-trails-length=Determina la durada del rastre \n[color=red]Atenció:[/color] Amb durades molt llargues, especialment quan hi hagi molts mossegadors, es veurà notablement afectat el rendiment del joc
biter-trails-color-type=Determina si el rastre el manté a terra o segueix el mossegador
biter-trails-palette=Determina la paleta multicolor
biter-trails-speed=Determina la velocitat de canvi de colors
biter-trails-balance=Determina, en certa manera, l'impacte del mod en el rendiment
# biter-trails-passengers-only=Determina si només els aranyatrons amb passatgers creen rastres
# biter-trails-tiptoe-mode=Determina si els rastres només es creen quan les cames dels aranyatrons toquen a terra

